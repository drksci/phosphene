[project]
name = "vttui"
version = "0.1.0"
description = "Deterministic compiler + reconciler: (terminal grid, role map) -> incremental A2UI message stream"
requires-python = ">=3.10"
dependencies = ["vtcore", "numpy>=1.24"]

[tool.uv.sources]
vtcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vttui"]
