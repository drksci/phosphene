[project]
name = "vtcore"
version = "0.1.0"
description = "asciicast parsing, VT emulation, keyframe sampling and grid encoding"
requires-python = ">=3.10"
dependencies = ["pyte>=0.8.2", "numpy>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtcore"]
